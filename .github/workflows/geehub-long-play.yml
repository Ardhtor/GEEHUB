name: GEEHUB Long Play

on:
  push:
    branches: [main]
    paths:
      - 'engine/long-play-runner.js'
      - 'engine/check_performance.py'
      - '.github/workflows/geehub-long-play.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: geehub-main-world-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Advance inherited world
        run: node engine/long-play-runner.js

      - name: Verify durable long-play output
        run: python engine/check_performance.py long-play

      - name: Commit world memory with conflict recovery
        run: |
          git config user.name "GEEHUB Long Play"
          git config user.email "actions@github.com"
          for attempt in 1 2 3; do
            echo "Long Play persistence attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            node engine/long-play-runner.js
            python engine/check_performance.py long-play
            git add hub/long-play-state.json hub/agent-reaction-history.json hub/recordings hub/image-jobs.json hub/render-jobs.json hub/exchange.json hub/world-state.json engine/state.json
            git diff --cached --quiet || git commit -m "GEEHUB long play cycle"
            if git push origin HEAD:main; then
              echo "Long Play state persisted."
              exit 0
            fi
            echo "Main advanced during persistence; rebuilding from the latest state."
            sleep 2
          done
          echo "Long Play could not persist after three attempts."
          exit 1
