name: GEEHUB Long Play

on:
  push:
    branches: [main]
    paths:
      - 'engine/long-play-runner.js'
      - '.github/workflows/geehub-long-play.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: geehub-main-world-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Advance inherited world
        run: node engine/long-play-runner.js

      - name: Commit world memory
        run: |
          git config user.name "GEEHUB Long Play"
          git config user.email "actions@github.com"
          git add hub/long-play-state.json hub/agent-reaction-history.json hub/recordings hub/image-jobs.json hub/render-jobs.json hub/exchange.json hub/world-state.json engine/state.json
          git diff --cached --quiet || git commit -m "GEEHUB long play cycle"
          git pull --rebase origin main
          git push
