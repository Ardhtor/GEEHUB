name: Luke Library Transformation Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout GEEHUB
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Validate the Library-grounded production
        run: |
          python3 engine/video/render_project.py --project production/projects/luke-library-transformation --validate-only

      - name: Render eight-second Luke muscle-growth transformation
        run: |
          set -o pipefail
          python3 engine/video/render_project.py \
            --project production/projects/luke-library-transformation \
            --preview-seconds 8 2>&1 | tee "$RUNNER_TEMP/luke-library-render.log"

      - name: Upload Blender scene, MP4, diagnostics and render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luke-library-transformation-preview
          path: |
            production/projects/luke-library-transformation/05_EXPORTS/
            production/projects/luke-library-transformation/04_COMPOSITES/
            production/projects/luke-library-transformation/07_MANIFESTS/growth_measurements.json
            ${{ runner.temp }}/luke-library-render.log
          if-no-files-found: warn
          retention-days: 14
