name: Deploy GEEHUB

on:
  push:
    branches: [main]
    paths-ignore:
      - 'engine/state.json'
      - 'lore/AUTONOMOUS_STREAM.md'
      - 'novel/WORLDS.md'
      - 'artifacts/world-events/**'
      - 'artifacts/index.json'
      - 'dropbox_outbox/**'
      - 'assets/geography/generated/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
