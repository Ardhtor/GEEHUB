name: The Tractus — self-starting engine

on:
  push:
    paths:
      - "engine/**"
      - "scripts/tractus_*.py"
      - "scripts/test_tractus_*.py"
      - "scripts/promote_canon_version.py"
      - "docs/TRACTUS_ENGINE_SPEC.md"
      - ".github/workflows/tractus-engine.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate without committing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tractus-autonomous-engine
  cancel-in-progress: false

jobs:
  continue-the-tractus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the living corpus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check engine syntax and continuity data
        run: |
          python -c "compile(open('scripts/tractus_engine.py', encoding='utf-8').read(), 'scripts/tractus_engine.py', 'exec')"
          python -c "compile(open('scripts/tractus_memory.py', encoding='utf-8').read(), 'scripts/tractus_memory.py', 'exec')"
          python -c "compile(open('scripts/promote_canon_version.py', encoding='utf-8').read(), 'scripts/promote_canon_version.py', 'exec')"
          python -m json.tool engine/schemas/innervation-cue-v2.schema.json > /dev/null
          python -m json.tool engine/campus-life.json > /dev/null
          python -m json.tool engine/tractus_narrative_queue.json > /dev/null
          python -m json.tool engine/retrieval_schedule.json > /dev/null
          python -m json.tool engine/retrieval_state.json > /dev/null
          python -m json.tool engine/schemas/tractus-revision.schema.json > /dev/null
          python -m json.tool engine/schemas/innervation-cue.schema.json > /dev/null
          python -B -m unittest discover -s scripts -p 'test_*.py'
          # Includes simulated concurrent I/O, repeated autosaves, large writes, and interrupted-save recovery.
          python -B -m unittest discover -s engine -p 'test_*.py'
          python engine/check_performance.py tractus-science

      - name: Generate one continuity-safe contribution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRACTUS_MODEL: ${{ vars.TRACTUS_MODEL }}
          TRACTUS_AUTONOMY_ENABLED: ${{ vars.TRACTUS_AUTONOMY_ENABLED || 'false' }}
          TRACTUS_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/tractus_engine.py

      - name: Push the engine's own commit with conflict recovery
        if: success()
        run: |
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "Rebase conflict; refusing to overwrite concurrent work."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Tractus commit persisted."
              exit 0
            fi
            echo "Remote advanced during push; retrying."
            sleep 2
          done
          echo "Could not persist Tractus commit after three attempts."
          exit 1
