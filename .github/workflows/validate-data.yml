name: Validate GEEHUB data

on:
  push:
    paths:
      - 'hub/**'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'world.json'
      - 'engine/**'
      - 'characters/**'
      - 'characters/**'
      - 'research/creators/**'
      - 'server/**'
      - 'validate-records.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'hub/**'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'world.json'
      - 'engine/**'
      - 'characters/**'
      - 'research/creators/**'
      - 'validate-records.py'
      - '.github/workflows/validate-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser script syntax
        run: |
          node --check app.js
          node --check server/geehub-server.mjs
          node --check engine/live-interlocutor.js
          node --check engine/shared-interaction.js
          node --check engine/reaction-consequence.js
          node --check engine/long-play-runner.js
          node --check artifacts/runtime.js
          node --check engine/story-atlas.js
          node --check engine/world-state-bridge.js
          node --check engine/screen-puncture.js
          node --check engine/world-autonomy.js
          node --check engine/environmental-transitions.js
          node --check engine/social-cyberspace.js
          node --check engine/agent-reactions.js
      - name: Validate followed social sources and character voice references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const social = JSON.parse(fs.readFileSync('hub/social-cyberspace.json', 'utf8'));
          const creators = JSON.parse(fs.readFileSync('research/creators/ACTIVE_CREATORS.json', 'utf8'));
          const voiceMap = JSON.parse(fs.readFileSync('hub/character-personality-references.json', 'utf8'));
          const agents = JSON.parse(fs.readFileSync('hub/agents.json', 'utf8'));
          const reactions = JSON.parse(fs.readFileSync('hub/agent-reaction-states.json', 'utf8'));
          const feed = fs.readFileSync('engine/social-cyberspace.js', 'utf8');
          const reactionEngine = fs.readFileSync('engine/agent-reactions.js', 'utf8');
          const followed = [
            ['youtube-detdert', 'https://www.youtube.com/channel/UCd7Tlj816jyDB8ywfJ4Ie6w', 'detdertReplies'],
            ['youtube-mang0', 'https://www.youtube.com/@mang0gobirds', 'mang0Replies']
          ];
          for (const [id,url,replyTable] of followed) {
            const source = social.watchSources.find(item => item.id === id);
            if (!source || source.url !== url || source.priority !== 'followed') throw new Error('Missing followed source: '+id);
            if (!feed.includes(url) || !feed.includes(replyTable)) throw new Error('Missing feed source or reply: '+id);
            if (!creators.some(item => item.id === id.replace('youtube-',''))) throw new Error('Missing creator registry entry: '+id);
          }
          const mappings = [
            ['luke','x-paapamurph','https://x.com/PaapaMurph','characters/records/LUKE.md','luke-personality'],
            ['tyler','x-tyleraledbetter','https://x.com/TylerALedbetter','characters/records/TYLER.md','tyler-personality'],
            ['chase','instagram-cw-sachs','https://www.instagram.com/c.w.sachs/','characters/records/CHASE.md','chase-personality'],
            ['gabe','instagram-river-m-g','https://www.instagram.com/river_m_g/','characters/records/GABE.md','gabe-personality'],
            ['andrew','x-andrewpsim','https://x.com/andrewpsim','characters/records/ANDREW.md','andrew-personality']
          ];
          for (const [character,id,url,record,feedId] of mappings) {
            const mapEntry=voiceMap.references.find(item=>item.character===character && item.url===url);
            const source=social.watchSources.find(item=>item.id===id && item.url===url && item.priority==='personality-reference');
            if (!mapEntry || !source) throw new Error('Character reference mapping incomplete: '+character);
            if (!fs.existsSync(record) || !feed.includes(url) || !feed.includes(feedId)) throw new Error('Character record/feed link missing: '+character);
            if (!mapEntry.reviewStatus.includes('pending')) throw new Error('Review state must remain explicit: '+character);
          }
          if (!agents.agents.some(agent=>agent.id==='gabe') || !reactions.agents.gabe || !reactionEngine.includes("id==='gabe'")) {
            throw new Error('Gabe must be represented in the named-agent and reaction systems.');
          }
          if (agents.agents.length !== 6) throw new Error('Expected six named agents after adding Gabe.');
          if (!social.personalityReferencePolicy || !social.personalityReferencePolicy.includes('Do not infer private traits')) {
            throw new Error('Personality-reference evidence boundary missing.');
          }
          console.log('Followed sources, five voice-reference mappings, character records, and Gabe reaction state verified.');
          NODE
      - name: Validate world broadcast and map coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const world = JSON.parse(fs.readFileSync('world.json', 'utf8'));
          const mapStart = app.indexOf('const STORY_PLACE_BY_REGION = ') + 'const STORY_PLACE_BY_REGION = '.length;
          const mapEnd = app.indexOf(';\nconst WORLD_BROADCASTS', mapStart);
          const broadcastStart = app.indexOf('const WORLD_BROADCASTS = ') + 'const WORLD_BROADCASTS = '.length;
          const broadcastEnd = app.indexOf(';\nfunction syncStoryLocation', broadcastStart);
          if (mapStart < 30 || mapEnd < mapStart || broadcastStart < 30 || broadcastEnd < broadcastStart) {
            throw new Error('Missing story place or broadcast registry');
          }
          const placeMap = JSON.parse(app.slice(mapStart, mapEnd));
          const broadcasts = JSON.parse(app.slice(broadcastStart, broadcastEnd));
          const autonomy = fs.readFileSync('engine/world-autonomy.js', 'utf8');
          const atlas = fs.readFileSync('engine/story-atlas.js', 'utf8');
          const atlasCss = fs.readFileSync('engine/story-atlas.css', 'utf8');
          const runtime = fs.readFileSync('artifacts/runtime.js', 'utf8');
          const bridge = fs.readFileSync('engine/world-state-bridge.js', 'utf8');
          const environment = fs.readFileSync('engine/environmental-transitions.js', 'utf8');
          if (!app.includes("source!=='restore')syncStoryLocation(n.id,n.name)")) throw new Error('World encounters must update the story map pin');
          if (atlas.includes("addEventListener('geehub:environmental-transition'")) throw new Error('Atmosphere changes must not teleport the story pin');
          if (!atlas.includes('storyMapRoute') || !atlas.includes("detail.type === 'ROUTE_OPEN'") || !atlasCss.includes('.story-atlas.route-open')) throw new Error('Visible autonomous route rendering is missing');
          if (!autonomy.includes('MAX_STORY_SECTIONS')) throw new Error('Narrative needs a bounded live history');
          const longPlay = fs.readFileSync('engine/long-play-runner.js', 'utf8');
          if (!longPlay.includes("const next=Number((prior+increment).toFixed(2))")) throw new Error('Long Play must not cap cumulative scale');
          if (!longPlay.includes("engineState.active_region=region.id")) throw new Error('Long Play must synchronize the current world location');
          if (!longPlay.includes("worldState.activeRecording='./recordings/'+recording.id+'.json'")) throw new Error('Long Play must promote its recording into the shared world state');
          if (!runtime.includes('type: item?.type || item?.kind') || !runtime.includes('body: item?.body ?? item?.content')) throw new Error('Archive renderer cannot normalize legacy and new artifacts');
          if (!bridge.includes("['ATMOSPHERE','MEMORY','ROUTE OPEN','CROSSING']")) throw new Error('Live world phase labels are out of sync');
          if (!autonomy.includes('raw.githubusercontent.com/Ardhtor/GEEHUB/main/engine/state.json')) throw new Error('Browser must hydrate from the newest persistent world ledger');
          if (environment.includes("const label = (button.textContent || '').trim().toUpperCase()")) throw new Error('Atmosphere must not respond to incidental button labels');
          if (!app.includes("context.source==='restore'?null:deriveWorldResponse(id,priorId)")) throw new Error('Restoring a session must not fabricate a new encounter outcome');
          const enterStart = app.indexOf('function deriveWorldResponse');
          const enterEnd = app.indexOf('function triggerHit()', enterStart);
          const encounterLogic = app.slice(enterStart, enterEnd);
          if (!autonomy.includes('geehub:world-encounter') || !autonomy.includes('function chooseNext') || !autonomy.includes('function tick')) {
            throw new Error('Autonomous world rules are missing');
          }
          if (encounterLogic.includes('Math.random')) throw new Error('World encounter outcomes must follow persisted rules, not random rolls');
          const missing = world.regions.map(r => r.id).filter(id => !placeMap[id] || !broadcasts[id]);
          if (missing.length) throw new Error('Missing world broadcast/map mapping: ' + missing.join(', '));
          for (const file of ['./engine/screen-puncture.css', './engine/screen-puncture.js', './engine/story-atlas.js', './engine/world-autonomy.js']) {
            if (!html.includes(file)) throw new Error('index.html does not load ' + file);
          }
          if (!html.includes('SETH / FIRST SIGHT') || !html.includes('THE NORTHERN ROAD')) {
            throw new Error('First-arrival story or map location is missing');
          }
          console.log('Validated ' + world.regions.length + ' world broadcasts, map destinations, and interface assets.');
          NODE
      - name: Validate Python tools
        run: python -m py_compile engine/inscription.py engine/test_inscription.py engine/run_world.py engine/check_performance.py hub/validate-jams.py hub/test-validate-jams.py hub/validate-projects.py hub/validate-ui-registry.py hub/test-validate-ui-registry.py hub/test-world-engine.py hub/test-long-play-runner.py
      - name: Run canonical inscription regression tests
        run: python -m unittest engine.test_inscription
      - name: Run portable jam regression test
        run: python hub/test-validate-jams.py
      - name: Run UI registry validator regression test
        run: python hub/test-validate-ui-registry.py
      - name: Run persistent world engine regression test
        run: python hub/test-world-engine.py
      - name: Run graph-driven Long Play regression test
        run: python hub/test-long-play-runner.py
      - name: Validate constellation registry
        run: python hub/validate-projects.py hub/projects.json
      - name: Validate browser repository links
        run: python hub/validate-ui-registry.py hub/projects.json hub/index.html
      - name: Validate records archive index when present
        run: |
          if [ -f records.json ]; then
            python validate-records.py records.json
          else
            echo 'records.json not present; skipping archive-index validation.'
          fi
