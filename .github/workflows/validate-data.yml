name: Validate GEEHUB data

on:
  push:
    paths:
      - 'hub/**'
      - 'validate-records.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'hub/**'
      - 'validate-records.py'
      - '.github/workflows/validate-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate portable jam validator syntax
        run: python -m py_compile hub/validate-jams.py hub/test-validate-jams.py
      - name: Run portable jam regression test
        run: python hub/test-validate-jams.py
      - name: Validate records archive index when present
        run: |
          if [ -f records.json ]; then
            python validate-records.py records.json
          else
            echo 'records.json not present; skipping archive-index validation.'
          fi
