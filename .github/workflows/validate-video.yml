name: GEEHUB video timeline validation

on:
  push:
    paths:
      - 'engine/video/**'
      - 'production/projects/**'
      - 'production/IMAGE_LIBRARY_INDEX.json'
      - '.github/workflows/validate-video.yml'
  pull_request:
    paths:
      - 'engine/video/**'
      - 'production/projects/**'
      - 'production/IMAGE_LIBRARY_INDEX.json'
      - '.github/workflows/validate-video.yml'

permissions:
  contents: read

jobs:
  validate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/video/requirements-ci.txt
      - name: Install timeline interchange adapter
        run: python -m pip install -r engine/video/requirements-ci.txt
      - name: Compile video tools
        run: python -m py_compile engine/video/validate_timeline.py engine/video/otio_export.py engine/video/import_gaussian_splat.py engine/video/gee_engine.py engine/video/blender_scene.py engine/video/rigged_character.py engine/video/render_project.py engine/video/stage_reference_image.py engine/video/production_validation.py engine/video/shot_sequence.py engine/video/timeline_growth.py engine/video/growth_geometry.py engine/video/growth_curves.py engine/video/tests/test_validate_timeline.py engine/video/tests/test_otio_export.py engine/video/tests/test_growth_geometry.py engine/video/tests/test_growth_curves.py engine/video/tests/test_gee_engine.py engine/video/tests/test_stage_reference_image.py engine/video/tests/test_production_validation.py engine/video/tests/test_shot_sequence.py engine/video/tests/blender_growth_integration.py engine/video/tests/blender_scene_smoke_test.py
      - name: Run timeline, provenance, and OpenTimelineIO regression tests
        run: python -m unittest engine.video.tests.test_validate_timeline engine.video.tests.test_otio_export engine.video.tests.test_growth_geometry engine.video.tests.test_growth_curves engine.video.tests.test_gee_engine engine.video.tests.test_stage_reference_image engine.video.tests.test_production_validation engine.video.tests.test_shot_sequence
      - name: Validate non-mock shot and production contracts
        run: python engine/video/production_validation.py
      - name: Run Blender 5.3 shape-key integration test
        run: python engine/video/tests/blender_growth_integration.py
      - name: Install headless OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libxrender1 libxi6 libxkbcommon0 xvfb xauth
      - name: Render full Hulum's Lab scene smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: timeout 600s xvfb-run -a python engine/video/tests/blender_scene_smoke_test.py
      - name: Upload Blender smoke preview
        uses: actions/upload-artifact@v4
        with:
          name: geehub-blender-5.3-smoke-preview
          path: engine/video/tests/output/blender-smoke/*
          if-no-files-found: error
          retention-days: 7
      - name: Validate Teal Titan production manifests
        run: python engine/video/validate_timeline.py
      - name: Validate continuous physique growth project
        run: python engine/video/render_project.py --validate-only
