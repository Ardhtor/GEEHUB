name: GEEHUB video timeline validation

on:
  push:
    paths:
      - 'engine/video/**'
      - 'production/projects/**'
      - '.github/workflows/validate-video.yml'
  pull_request:
    paths:
      - 'engine/video/**'
      - 'production/projects/**'
      - '.github/workflows/validate-video.yml'

permissions:
  contents: read

jobs:
  validate-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install timeline interchange adapter
        run: python -m pip install --upgrade opentimelineio
      - name: Compile video tools
        run: python -m py_compile engine/video/validate_timeline.py engine/video/otio_export.py engine/video/import_gaussian_splat.py engine/video/gee_engine.py engine/video/timeline_growth.py engine/video/growth_geometry.py engine/video/growth_curves.py engine/video/tests/test_validate_timeline.py engine/video/tests/test_otio_export.py engine/video/tests/test_growth_geometry.py engine/video/tests/test_growth_curves.py
      - name: Run timeline, provenance, and OpenTimelineIO regression tests
        run: python -m unittest engine.video.tests.test_validate_timeline engine.video.tests.test_otio_export engine.video.tests.test_growth_geometry engine.video.tests.test_growth_curves
      - name: Validate Teal Titan production manifests
        run: python engine/video/validate_timeline.py
