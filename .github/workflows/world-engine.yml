name: GEEHUB // AUTONOMOUS WORLD ENGINE

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  world-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run world engine
        run: python engine/run_world.py
      - name: Commit world output
        run: |
          git config user.name "GEEHUB World Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/state.json lore/AUTONOMOUS_STREAM.md novel/WORLDS.md
          git diff --cached --quiet || git commit -m "Autonomous world pulse"
          git push
