<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>GEEHUB // Asset Desk</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111922;--line:#293945;--ice:#a8e8ff;--muted:#8293a0;--amber:#d7b27a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e4edf3;font:13px/1.5 ui-monospace,Menlo,monospace}header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{color:var(--ice);letter-spacing:.18em}main{max-width:1400px;margin:auto;padding:18px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:8px}.eyebrow{color:var(--amber);font-size:10px;letter-spacing:.15em;margin-bottom:12px}label{display:block;color:#9fb2bd;margin:12px 0 5px}input,select,textarea,button{font:inherit;color:#e4edf3;background:#0b1117;border:1px solid #3a4b58;padding:9px;border-radius:4px;width:100%}button{cursor:pointer;background:#172733}button:hover{border-color:var(--ice)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.preview{background:#05090d;border:1px solid var(--line);border-radius:8px;min-height:440px;display:grid;place-items:center;position:relative;overflow:hidden}.preview svg{width:min(88%,720px);height:auto;max-height:580px}.preview:after{content:"ORTHOGRAPHIC ASSET VIEW / GENERATED IN THIS BROWSER";position:absolute;top:12px;left:14px;color:#647987;font-size:10px}.inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;margin-top:14px}.item{border:1px solid var(--line);padding:10px;border-radius:6px;background:#0d141b;cursor:pointer}.item.active{border-color:var(--ice)}.item small{color:var(--muted);display:block}.item svg{width:100%;height:90px;background:#070c11;margin:7px 0}.status{color:#8fd7ad;font-size:11px}a{color:var(--ice)}@media(max-width:850px){main{grid-template-columns:1fr}.preview{min-height:300px}}
</style></head><body>
<header><div><div class="brand">GEEHUB // ASSET DESK</div><div style="color:var(--muted)">Local procedural asset workshop · no account · no external service</div></div><a href="gee-studio.html">RETURN TO STUDIO ↗</a></header>
<main><aside class="panel"><div class="eyebrow">01 / ASSET SPECIFICATION</div>
<label for="name">Asset name</label><input id="name" value="Northgate shoulder guard">
<label for="kind">Asset family</label><select id="kind"><option value="armor">Clothing / armor panel</option><option value="limb">Limb component</option><option value="prop">Handheld prop</option><option value="architecture">Architectural piece</option><option value="ornament">Symbol / ornament</option><option value="environment">Environment fragment</option></select>
<label for="material">Material</label><select id="material"><option value="steel">Brushed steel</option><option value="wood">Dark oak</option><option value="cloth">Heavy cloth</option><option value="stone">Weathered stone</option><option value="amber">Amber resin</option><option value="ice">Blue glass</option></select>
<label for="width">Width <span id="wv">1.0</span></label><input id="width" type="range" min=".4" max="2.4" step=".1" value="1">
<label for="height">Height <span id="hv">1.0</span></label><input id="height" type="range" min=".4" max="2.4" step=".1" value="1">
<label for="detail">Flourish <span id="dv">2</span></label><input id="detail" type="range" min="0" max="5" step="1" value="2">
<label for="note">Design note</label><textarea id="note" rows="3" placeholder="Origin, use, continuity, construction..."></textarea>
<div class="actions"><button id="generate">GENERATE</button><button id="save">SAVE TO DESK</button><button id="svg">EXPORT SVG</button><button id="png">EXPORT PNG</button><button id="json">EXPORT INVENTORY</button><button id="clear">CLEAR DESK</button></div><p class="status" id="status">Ready. Assets remain in this browser until exported.</p>
</aside><section><div class="preview" id="preview"></div><div class="eyebrow" style="margin-top:16px">02 / LOCAL INVENTORY · SELECT AN ASSET TO REOPEN</div><div class="inventory" id="inventory"></div></section></main>
<script>
const $=id=>document.getElementById(id), key='geehub.assetdesk.v1';let current=null,items=[];
const palettes={steel:['#b7c8d0','#536b78','#e6f1f4'],wood:['#8b6546','#493528','#c59a6d'],cloth:['#526f83','#263d4d','#91b3c4'],stone:['#888e91','#41494e','#c1c5c4'],amber:['#bd8750','#62452f','#edc58c'],ice:['#75b6ca','#31566b','#c2f2ff']};
function spec(){return{name:$('name').value||'Untitled asset',kind:$('kind').value,material:$('material').value,w:+$('width').value,h:+$('height').value,detail:+$('detail').value,note:$('note').value,created:new Date().toISOString()}}
function shape(a,mini=false){const p=palettes[a.material],w=160*a.w,h=190*a.h,cx=360,cy=300,detail=a.detail;let body='';
if(a.kind==='architecture')body='<path d="M220 430V220L360 110 500 220V430Z"/><path d="M320 430V290Q360 220 400 290V430Z" fill="#101820"/>';
else if(a.kind==='limb')body='<path d="M300 120Q360 95 420 135L405 260 390 420Q360 455 330 420L315 260Z"/>';
else if(a.kind==='prop')body='<path d="M335 115L385 115 390 310 420 350 410 390 310 390 300 350 330 310Z"/>';
else if(a.kind==='ornament')body='<path d="M360 90L420 230 560 300 420 370 360 510 300 370 160 300 300 230Z"/>';
else if(a.kind==='environment')body='<path d="M160 430L250 240 320 330 400 150 560 430Z"/>';
else body='<path d="M235 190Q260 110 360 120Q460 110 485 190L450 340 410 430H310L270 340Z"/>';
let lines='';for(let i=0;i<detail;i++){let y=190+i*38;lines+='<path d="M285 '+y+' Q360 '+(y+20)+' 435 '+y+'" fill="none" stroke="'+p[2]+'" stroke-width="5" opacity=".8"/>'}
let studs='';for(let i=0;i<detail+1;i++)studs+='<circle cx="'+(300+i*30)+'" cy="160" r="5" fill="'+p[2]+'"/>';
return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="'+p[2]+'"/><stop offset=".48" stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[1]+'"/></linearGradient></defs><rect width="720" height="600" fill="#070d13"/><g opacity=".17" stroke="#7290a0"><path d="M0 500H720M0 400H720M0 300H720M0 200H720M120 0V600M240 0V600M360 0V600M480 0V600M600 0V600"/></g><g transform="translate('+ (360-w/2) +' '+(300-h/2)+') scale('+a.w+' '+a.h+')" stroke="'+p[1]+'" stroke-width="9" stroke-linejoin="round" fill="url(#g)">'+body+lines+studs+'</g><text x="28" y="555" fill="#9bb2c0" font-family="monospace" font-size="14">'+a.name.replace(/[<>&]/g,'')+'</text><text x="28" y="578" fill="#647c8b" font-family="monospace" font-size="10">'+a.kind.toUpperCase()+' / '+a.material.toUpperCase()+'</text></svg>'}
function draw(){if(!current)current=spec();$('preview').innerHTML=shape(current);$('wv').textContent=current.w.toFixed(1);$('hv').textContent=current.h.toFixed(1);$('dv').textContent=current.detail}
function save(){if(!current)draw();items.unshift({...current,id:'asset-'+Date.now().toString(36)});persist();renderList();$('status').textContent='Saved locally · '+items.length+' assets in desk'}
function persist(){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){$('status').textContent='Browser storage full; export inventory to preserve your work.'}}
function renderList(){$('inventory').innerHTML=items.map((a,i)=>'<div class="item" data-i="'+i+'"><b>'+a.name.replace(/[<>&]/g,'')+'</b><small>'+a.kind+' / '+a.material+'</small>'+shape(a).replace('<svg ','<svg style="height:90px" ')+'</div>').join('');$('inventory').querySelectorAll('.item').forEach(el=>el.onclick=()=>{current=items[+el.dataset.i];$('name').value=current.name;$('kind').value=current.kind;$('material').value=current.material;$('width').value=current.w;$('height').value=current.h;$('detail').value=current.detail;$('note').value=current.note||'';draw()})}
function dl(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$('generate').onclick=()=>{current=spec();draw();$('status').textContent='Generated locally · no network request'};
$('save').onclick=save;$('svg').onclick=()=>{if(!current)draw();dl((current.name.replace(/[^a-z0-9]+/gi,'-')||'asset')+'.svg',new Blob([shape(current)],{type:'image/svg+xml'}))};
$('png').onclick=()=>{if(!current)draw();let blob=new Blob([shape(current)],{type:'image/svg+xml'}),u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=1440;c.height=1200;c.getContext('2d').drawImage(im,0,0,1440,1200);c.toBlob(b=>dl('geehub-asset.png',b),'image/png');URL.revokeObjectURL(u)};im.src=u};
$('json').onclick=()=>dl('geehub-asset-inventory.json',new Blob([JSON.stringify({schema:'geehub.assetdesk.v1',assets:items},null,2)],{type:'application/json'}));
$('clear').onclick=()=>{if(confirm('Clear the local inventory? Export it first if you need a copy.')){items=[];persist();renderList();$('status').textContent='Local desk cleared'}};
['width','height','detail'].forEach(id=>$(id).oninput=()=>{current=spec();draw()});['name','kind','material','note'].forEach(id=>$(id).onchange=()=>{current=spec();draw()});
try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){items=[]}draw();renderList();
</script></body></html>
