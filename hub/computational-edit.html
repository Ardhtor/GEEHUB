<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a12"><title>GEEHUB // COMPUTATIONAL EDIT</title>
<style>
:root{color-scheme:dark;--ice:#9feaff;--violet:#a38cff;--ink:#070a12}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:#e9f5ff;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}body{overflow-x:hidden}.frame{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px;gap:12px;background:radial-gradient(ellipse at 50% 46%,#14253a 0,#080c16 48%,#05070c 100%)}header,footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;letter-spacing:.14em;text-transform:uppercase;color:#a7c8dc}h1{font-size:clamp(17px,2vw,25px);font-weight:500;letter-spacing:.22em;margin:4px 0;color:#f3fbff}.status{color:var(--ice)}.stage{position:relative;min-height:65vh;border:1px solid #29465a;background:#050a12;overflow:hidden;isolation:isolate;box-shadow:0 0 60px #48baff0b,inset 0 0 80px #55c8ff0c}canvas{width:100%;height:100%;position:absolute;inset:0;display:block}.readout{position:absolute;left:18px;bottom:17px;color:#a4c6da;max-width:360px;text-shadow:0 1px 5px #000}.readout strong{display:block;color:#dff8ff;font-size:12px;font-weight:500;letter-spacing:.18em;margin-bottom:4px}.coordinates{position:absolute;right:18px;top:16px;text-align:right;color:#7099b5;font-size:10px;letter-spacing:.12em}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;letter-spacing:.12em;color:#dff8ff;background:#0a1623;border:1px solid #3a647d;padding:10px 15px;cursor:pointer;text-transform:uppercase}button:hover,button:focus-visible{background:#142b40;border-color:var(--ice);outline:none}.primary{background:#112a3a;border-color:#8ce4ff;color:#fff}.knob{display:flex;gap:8px;align-items:center;color:#9cb8cb}.knob input{width:105px;accent-color:#8ce4ff}.footnote{color:#5d7e95;letter-spacing:.08em}@media(max-width:650px){.frame{padding:9px}.stage{min-height:70vh}.readout{max-width:70%}.knob{display:none}}
</style></head>
<body><main class="frame">
<header><div><div>GEEHUB / MACHINE VISION / 0001</div><h1>THE FORM THAT COMPUTES ITSELF</h1></div><div class="status" id="status">FIELD STABLE · PASS 01</div></header>
<section class="stage" aria-label="Procedurally generated computational artwork"><canvas id="field"></canvas><div id="worldMemory" style="position:absolute;left:18px;top:18px;max-width:min(340px,70%);padding:9px 11px;border-left:1px solid #6ecce9;background:#07101bd9;color:#8fb4ca;font-size:10px;letter-spacing:.08em;line-height:1.6">WORLD MEMORY / CONNECTING…</div><div class="coordinates" id="coords">X 000 / Y 000<br>DEPTH FIELD // LIVE</div><div class="readout"><strong id="name">COLD INHERITANCE</strong><span id="desc">A shape is inferred from its own consequences. The next pass will remember this one.</span></div></section>
<footer><div class="controls"><button class="primary" id="run">RUN / MUTATE</button><button id="freeze">FREEZE FIELD</button><button id="save">SAVE FRAME</button></div><label class="knob">COMPLEXITY <input id="complexity" type="range" min="2" max="8" value="5"></label><div class="footnote">NO TEMPLATE / RECURSIVE GEOMETRY / MEMORY IN MOTION</div></footer>
</main>
<script>
(()=>{'use strict';
const memoryPanel=document.querySelector('#worldMemory');
Promise.all([fetch('./world-state.json').then(r=>r.ok?r.json():null),fetch('./visual_memory.json').then(r=>r.ok?r.json():null)]).then(([world,memory])=>{if(!world&&!memory){memoryPanel.textContent='WORLD MEMORY / SOURCE FILES UNAVAILABLE';return}const region=world?.activeEncounter?.regionName||world?.livePlay?.regionId||'WORLD STATE';const scale=world?.activeEncounter?.subject?.scale;const sequence=memory?.sequence?.length||0;memoryPanel.textContent='INHERITED STATE / '+region+(scale?' / SCALE '+scale+'×':'')+' / VISUAL MEMORY '+sequence+' FRAMES';memoryPanel.title='Source: hub/world-state.json + hub/visual_memory.json'}).catch(()=>{memoryPanel.textContent='WORLD MEMORY / LOCAL FALLBACK'});
const c=document.querySelector('#field'),ctx=c.getContext('2d',{alpha:false}),run=document.querySelector('#run'),freeze=document.querySelector('#freeze'),save=document.querySelector('#save'),complexity=document.querySelector('#complexity'),status=document.querySelector('#status'),name=document.querySelector('#name'),desc=document.querySelector('#desc'),coords=document.querySelector('#coords');
let w=0,h=0,dpr=1,phase=1,seed=92831,frozen=false,raf=0,last=0,mouse={x:.5,y:.5};
const titles=['COLD INHERITANCE','THE SHAPE REMEMBERS','ELECTRIC LINEAGE','A BODY OF ALGORITHMS','CONVERGENCE ENGINE','THE ROOM LEARNS','IMPOSSIBLE PROPORTION','RETURN WITH DIFFERENCE'];
const descriptions=['A shape is inferred from its own consequences. The next pass will remember this one.','The old geometry persists as a faint pressure beneath the new structure.','No single hand could keep these relationships balanced at this scale.','Every branch inherits a rule, then bends it until the rule becomes visible.','Two systems meet. Their interference becomes the next material.','The field has learned where to place its silence.','Scale changes; identity remains legible through the transformation.','The result is not a copy of the beginning. It is what the beginning made possible.'];
function randFactory(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function resize(){const r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw(performance.now())}
function glowLine(points,color,width,alpha){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1}
function draw(t){if(!w||!h)return;ctx.fillStyle='#050912';ctx.fillRect(0,0,w,h);let rng=randFactory(seed),cx=w*(.5+(mouse.x-.5)*.12),cy=h*(.5+(mouse.y-.5)*.12),scale=Math.min(w,h),depth=+complexity.value;
const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*.58);grad.addColorStop(0,'#152d42');grad.addColorStop(.42,'#0a1423');grad.addColorStop(1,'#050912');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
// computational coordinate lattice
ctx.globalAlpha=.17;ctx.strokeStyle='#4b94b5';ctx.lineWidth=.5;let step=28;for(let x=(w%step)/2;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=(h%step)/2;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.globalAlpha=1;
const time=frozen?0:t*.00018+phase*.77;
for(let layer=0;layer<4;layer++){let n=24+layer*13;for(let i=0;i<n;i++){let a=(i/n)*Math.PI*2+layer*.23+Math.sin(time+layer)*.07;let radius=scale*(.06+layer*.075)+Math.sin(a*5+time)*scale*.018;let x=cx+Math.cos(a)*radius*(1+layer*.12),y=cy+Math.sin(a)*radius*.67;let points=[];let bends=3+Math.floor(rng()*5);for(let j=0;j<=bends;j++){let u=j/bends;let twist=Math.sin(a*3+u*7+time+layer)*scale*.012;points.push([x+Math.cos(a+u*1.8)*scale*(u*.07)+twist,y+Math.sin(a+u*2.4)*scale*(u*.06)-twist])}glowLine(points,layer%2?'#83dfff':'#9d91ff',layer===0?1.1:.65,.13+layer*.045)}}
// recursive branching structure: mirrored but imperfect, like a machine finding a body plan
function branch(x,y,angle,len,level,width,side){if(level<=0||len<1.4)return;let bend=(rng()-.5)*.62+Math.sin(time*1.3+level*.8+side)*.1;let a=angle+bend;let nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;let col=level>depth*.65?'#a5edff':level>depth*.35?'#719ccf':'#b19aff';glowLine([[x,y],[nx,ny]],col,width,.25+level/depth*.35);if(level===Math.ceil(depth*.5)){ctx.beginPath();ctx.arc(nx,ny,2+len*.03,0,Math.PI*2);ctx.fillStyle='#d9f8ff';ctx.globalAlpha=.6;ctx.fill();ctx.globalAlpha=1}let factor=.69+rng()*.12;branch(nx,ny,a-.48-rng()*.2,len*factor,level-1,width*.72,side-.1);branch(nx,ny,a+.51+rng()*.22,len*factor,level-1,width*.72,side+.1);if(level>3&&rng()>.45)branch(nx,ny,a+(rng()-.5)*.3,len*.52,level-2,width*.55,side+.2)}
for(let side of [-1,1]){for(let i=0;i<7;i++){let a=(side<0?Math.PI:0)+(i-3)*.13+Math.sin(time+i)*.025;let ox=cx+side*scale*(.035+i*.009),oy=cy+(i-3)*scale*.035;branch(ox,oy,a,scale*(.105+(i%3)*.018),depth,1.3,side*i)}}
// fine spectral contours generated from interference, not a stock image
for(let k=0;k<18;k++){let pts=[],r=scale*(.10+k*.012);for(let j=0;j<=240;j++){let a=j/240*Math.PI*2;let wave=Math.sin(a*(3+(k%5))+time+k*.7)*scale*.009+Math.sin(a*11-time*1.4)*scale*.003;let rr=r+wave;pts.push([cx+Math.cos(a)*rr*(1+Math.sin(a*2+k)*.035),cy+Math.sin(a)*rr*.58])}glowLine(pts,k%3===0?'#d1f6ff':k%3===1?'#6bc9ef':'#8f7df0',.6,.17)}
// central optical aperture
for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(cx,cy,scale*(.018+i*.009),scale*(.028+i*.011),time*.05+i*.1,0,Math.PI*2);ctx.strokeStyle=i%2?'#9cddff':'#d0b9ff';ctx.globalAlpha=.2;ctx.lineWidth=.8;ctx.stroke()}ctx.globalAlpha=1;
ctx.fillStyle='#c7f5ff';ctx.globalAlpha=.42;ctx.fillRect(cx-1,cy-1,2,2);ctx.globalAlpha=1;
}
function tick(t){if(!frozen){draw(t);raf=requestAnimationFrame(tick)}}function evolve(){phase++;seed=(Math.imul(seed,1664525)+1013904223)>>>0;name.textContent=titles[(phase-1)%titles.length];desc.textContent=descriptions[(phase-1)%descriptions.length];status.textContent='FIELD MUTATED · PASS '+String(phase).padStart(2,'0');coords.innerHTML='SEED '+seed.toString(16).toUpperCase()+'<br>DEPTH '+complexity.value+' // LIVE';draw(performance.now())}
run.addEventListener('click',()=>{evolve();if(!frozen){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});freeze.addEventListener('click',()=>{frozen=!frozen;freeze.textContent=frozen?'RESUME FIELD':'FREEZE FIELD';status.textContent=frozen?'FIELD HELD · PASS '+String(phase).padStart(2,'0'):'FIELD LIVE · PASS '+String(phase).padStart(2,'0');if(!frozen){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)});save.addEventListener('click',()=>{const a=document.createElement('a');a.download='geehub-computational-edit-pass-'+String(phase).padStart(2,'0')+'.png';a.href=c.toDataURL('image/png');a.click();status.textContent='FRAME EXPORTED · PASS '+String(phase).padStart(2,'0')});complexity.addEventListener('input',()=>draw(performance.now()));c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();mouse={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};if(frozen)draw(performance.now())});window.addEventListener('resize',resize);resize();raf=requestAnimationFrame(tick);
})();
</script></body></html>
