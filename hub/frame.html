<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEEHUB // FRAME</title>
<style>
:root{color-scheme:dark;--bg:#05070a;--panel:#0d1116;--line:#29313a;--text:#e7ebef;--muted:#7e8995}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}body{overflow:hidden}.frame{height:100%;display:grid;grid-template-rows:auto 1fr auto}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(9,12,16,.88);backdrop-filter:blur(12px)}.eyebrow{font:9px "Courier New",monospace;letter-spacing:.16em;color:var(--muted)}h1{font:600 17px Georgia,serif;margin:3px 0 0}.state{font:9px "Courier New",monospace;color:var(--muted)}.field{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#161c23,#070a0e 62%,#030405)}.grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(220,225,230,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(220,225,230,.025) 1px,transparent 1px);background-size:44px 44px;transform:perspective(900px) rotateX(58deg)}.center{position:absolute;left:50%;top:50%;width:90px;height:90px;transform:translate(-50%,-50%);border:1px solid #4c5661;border-radius:50%;display:grid;place-items:center;color:#6e7985;font:9px "Courier New",monospace;letter-spacing:.15em}.material{position:absolute;transform:translate(-50%,-50%);min-width:120px;padding:12px;border:1px solid #39434e;border-radius:11px;background:rgba(16,21,27,.9);box-shadow:0 14px 36px #0008;cursor:pointer}.material strong{display:block;margin-top:5px}.material small{display:block;margin-top:5px;color:#707b87;font:9px "Courier New",monospace}.material.selected{border-color:#c0c8d0;box-shadow:0 0 28px #cbd5df18}.foot{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#090c10}.foot button{border:1px solid #39434d;background:#11171d;color:#dce2e7;border-radius:6px;padding:8px 11px;font:9px "Courier New",monospace;letter-spacing:.1em}.foot button:first-child{background:#d9dee5;color:#090c10}
</style></head><body><main class="frame"><header class="head"><div><div class="eyebrow">GEEHUB / CHAT FRAME</div><h1>THE WORLD IS WITHIN REACH</h1></div><div id="state" class="state">READY</div></header><section id="field" class="field"><div class="grid"></div><div class="center">DWELL</div></section><footer class="foot"><button onclick="location.href='../index.html'">FULL WORLD</button><button onclick="location.reload()">RESET FIELD</button><button onclick="document.getElementById('state').textContent='ARRIVE → PLACE → DWELL → FUSE'">WORK</button></footer></main>
<script>
const items=[['WORLDS','CHAPTER',18,25],['BEEFYTHIQ BIOGRAPHIES','PERSON',72,28],['SWARVIC DANCE','MOTION',28,70],['RECURSIVE CONTROL','RULE',72,70]];
const field=document.getElementById('field');
items.forEach((x,i)=>{const b=document.createElement('button');b.className='material';b.style.left=x[2]+'%';b.style.top=x[3]+'%';b.innerHTML='<span class="eyebrow">'+x[1]+'</span><strong>'+x[0]+'</strong><small>material '+(i+1)+'</small>';b.onclick=()=>{document.querySelectorAll('.material').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');document.getElementById('state').textContent='PRESENT / '+x[0]};field.appendChild(b)});
</script></body></html>
