<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEEHUB — Narrative Jammer</title>
<style>
body{margin:0;background:#0b0d10;color:#eee;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:30px}.hero{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:12px 16px;border:1px solid #454d58;border-radius:8px;background:#171b20;color:#eee;cursor:pointer}.primary{background:#eee;color:#111}.jam{margin:18px 0;padding:20px;border:1px solid #39414b;border-radius:12px;background:#14181d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:16px;border:1px solid #2d333b;border-radius:10px;background:#12161a}.muted{color:#929aa6;font-size:12px}.tags{color:#aab1ba;font-size:12px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="muted">GEEHUB / NARRATIVE JAMMER</div>
<h1>Pick a door. Kick it open.</h1>
<p class="muted">Press a button. Get a collision. Make the tiny version.</p>
<div class="hero">
<button id="surprise" class="btn primary">SURPRISE ME</button>
<button id="body" class="btn">FOCUS: BODY</button>
<button id="saved" class="btn">SHOW SAVED</button>
<button id="export" class="btn">EXPORT SAVED</button>
</div>
<section class="jam" aria-live="polite">
<div id="text">Press SURPRISE ME.</div>
<div id="meta" class="muted">Curiosity first.</div>
<div id="actions" class="actions"></div>
<div id="artifact" class="jam" hidden></div>
</section>
<input id="search" class="btn" style="width:100%;margin:8px 0;" placeholder="Find a project…">
<div id="stats" class="muted"></div>
<div id="results" class="grid" style="margin-top:12px"></div>
</main>
<script>
/*
  BUILD NOTE
  ----------
  The jammer is a doorway, not a framework. It is intentionally self-contained:
  the project list, interaction rules, and artifact-making loop all live here so
  the first useful action never depends on a package manager, build step, or
  second runtime request. The design contract is discover -> synthesize -> build ->
  test -> expand. A good button therefore produces a concrete premise, then a
  small artifact brief that can be saved, copied, made, and carried elsewhere.

  Persistence is deliberately local-first. Saved briefs remain in the browser,
  while EXPORT SAVED creates a portable JSON snapshot. This keeps the surface
  simple without trapping useful work inside one browser profile.
*/
const P=[
['BodyLounger Research Archive','archive','active','historical web research',['archive','research']],
['BEEFYTHIQ','system','active','generative grammar of mass, presence, mutation, and growth',['grammar','growth']],
['The Complex','world','active','persistent creative environment',['world','continuity']],
['Growth Canvas','system','incubating','visual transformation workspace',['visual','rules']],
['Liminal Gains','game','incubating','co-op growth game',['game','co-op']],
['BIG BRUTEFORCE','game','incubating','mutation-engine prototype',['game','mutation']],
['The Facility','world','incubating','fictional research environment',['fiction','research']],
['Muscle Myth','myth','active','pantheon and transformation mythology',['myth','canon']],
['Growth Tools','tool','incubating','image and video experimentation',['tool','vision']],
['Discovery Engine','tool','incubating','discovery and recommendation experiments',['search','discovery']],
['Retro Lab','aesthetic','dormant','Y2K and older-web experiments',['retro','y2k']],
['Religion as Dialogue','research','active','dialogue and religious-studies research',['thesis','research']],
['The Gods','god','incubating','deities, symbols, myths, and artifacts',['gods','canon']],
['Blender Stand / 3D Workspace','3d','incubating','models, scenes, cameras, and visual output',['blender','3d']]
].map(([name,group,status,summary,tags])=>({id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name,group,status,summary,tags}));
const verbs=['collides with','infects','rebuilds','haunts','tests','renders','escapes into'];
const media=['Blender blockout','five-frame storyboard','single-page web toy','character turnaround','tiny game mechanic','poster-sized diagram','one-minute sound loop'];
const constraints=['one dominant shape','three objects only','one strange material','black-and-white','under five minutes','one rule repeated three times'];
const bodyLines=['BODY: proportion, silhouette, posture, surface, presence.','Zoom in until one physical detail changes the whole figure.','Treat anatomy as a design language: structure → gesture → character.','Let lighting and camera become part of the body.'];
const $=s=>document.querySelector(s), pick=a=>a[Math.floor(Math.random()*a.length)];
let query='';
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function visible(){const q=query.toLowerCase().trim();return P.filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));}
function render(){const rows=visible();$('#stats').textContent=`${rows.length} shown · ${P.length} total`;$('#results').innerHTML=rows.map(p=>`<article class="card"><div class="muted">${esc(p.status)} · ${esc(p.group)}</div><h3>${esc(p.name)}</h3><p>${esc(p.summary)}</p><div class="tags">${p.tags.map(t=>'#'+esc(t)).join(' ')}</div></article>`).join('')||'<div class="card">Nothing found.</div>';}
function focusProject(p){query=p.name;$('#search').value=p.name;render();$('#results').scrollIntoView({behavior:'smooth',block:'start'});}
function setActions(items){$('#actions').innerHTML=items.map(i=>`<button class="btn" id="${i.id}">${i.label}</button>`).join('');items.forEach(i=>document.getElementById(i.id).onclick=i.fn);}
function savedJams(){try{return JSON.parse(localStorage.getItem('geehub-jams')||'[]');}catch{return[];}}
function jam(){const a=pick(P.filter(p=>p.group!=='archive'));const pool=P.filter(p=>p.id!==a.id&&p.group!==a.group);const b=pick(pool.length?pool:[a]);const v=pick(verbs);$('#artifact').hidden=true;$('#text').textContent=`${a.name} ${v} ${b.name}. Make one tiny thing where both must obey the same rule.`;$('#meta').textContent=`${a.group} × ${b.group} · Keep it small.`;setActions([{id:'open',label:'OPEN',fn:()=>focusProject(a)},{id:'make',label:'MAKE IT',fn:()=>artifact(a,b,v)},{id:'again',label:'AGAIN',fn:jam}]);}
function bodyMode(){ $('#artifact').hidden=true; $('#text').textContent=pick(bodyLines); $('#meta').textContent='FOCUS: BODY · form, scale, presence, consequence.'; setActions([{id:'study',label:'MAKE A BODY STUDY',fn:()=>artifact({id:'body',name:'Body Focus',group:'3d'},{id:'blender',name:'Blender Stand',group:'3d'},'studies')},{id:'again',label:'AGAIN',fn:bodyMode}]); }
function artifact(a,b,v){const m=pick(media),c=pick(constraints);const title=`${a.name} / ${b.name} — Tiny Study`;const brief=`${a.name} ${v} ${b.name}. Build a ${m} where the shared constraint is: ${c}. Start with the simplest possible version, then make exactly one element stranger.`;const saved=savedJams();saved.unshift({title,brief,createdAt:new Date().toISOString(),from:[a.id,b.id]});localStorage.setItem('geehub-jams',JSON.stringify(saved.slice(0,40)));$('#artifact').hidden=false;$('#artifact').innerHTML=`<b>${esc(title)}</b><p>${esc(brief)}</p><div class="actions"><button id="copy" class="btn">COPY</button><button id="again" class="btn">MAKE ANOTHER</button></div>`;$('#copy').onclick=()=>navigator.clipboard?.writeText(brief).then(()=>$('#meta').textContent='Copied. Now make the tiny version.').catch(()=>$('#meta').textContent='Saved here; the brief is visible above.');$('#again').onclick=jam;$('#artifact').scrollIntoView({behavior:'smooth',block:'nearest'});}
function exportSaved(){const data=savedJams();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='geehub-jams.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),0);$('#meta').textContent=data.length?`Exported ${data.length} saved jam${data.length===1?'':'s'}.`:'No saved jams to export.';}
$('#surprise').onclick=jam;$('#body').onclick=bodyMode;$('#saved').onclick=()=>{const s=savedJams();$('#text').textContent=s.length?s[0].brief:'No saved jams yet.';$('#meta').textContent=`${s.length} saved jam${s.length===1?'':'s'} in this browser.`;setActions([{id:'again',label:'MAKE ANOTHER',fn:jam}]);};$('#export').onclick=exportSaved;$('#search').oninput=e=>{query=e.target.value;render();};
render();jam();
</script>
</body>
</html>
