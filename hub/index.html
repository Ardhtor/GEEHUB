<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEEHUB — Narrative Jammer</title>
<style>
body{margin:0;background:#0b0d10;color:#eee;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:30px}.hero{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:12px 16px;border:1px solid #454d58;border-radius:8px;background:#171b20;color:#eee;cursor:pointer}.primary{background:#eee;color:#111}.jam{margin:18px 0;padding:20px;border:1px solid #39414b;border-radius:12px;background:#14181d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:16px;border:1px solid #2d333b;border-radius:10px;background:#12161a}.muted{color:#929aa6;font-size:12px}.tags{color:#aab1ba;font-size:12px;margin-top:10px}.repo-link{display:inline-block;margin-top:12px;color:#d7e7ff;text-decoration:none}.repo-link:hover{text-decoration:underline}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="muted">GEEHUB / NARRATIVE JAMMER</div>
<h1>Pick a door. Kick it open.</h1>
<p class="muted">Press a button. Get a collision. Make the tiny version.</p>
<div class="hero">
<button id="surprise" class="btn primary">SURPRISE ME</button>
<button id="body" class="btn">FOCUS: BODY</button>
<button id="luke" class="btn">LOVE POTION 11: LUKE</button>
<button id="saved" class="btn">SHOW SAVED</button>
<button id="export" class="btn">EXPORT SAVED</button>
<button id="import" class="btn">IMPORT SAVED</button>
<input id="importFile" type="file" accept="application/json,.json" hidden>
</div>
<section class="jam" aria-live="polite">
<div id="text">Press SURPRISE ME.</div>
<div id="meta" class="muted">Curiosity first.</div>
<div id="actions" class="actions"></div>
<div id="artifact" class="jam" hidden></div>
</section>
<div class="filters">
<label class="sr-only" for="search">Find a project</label>
<input id="search" class="btn" style="flex:1;min-width:220px;" placeholder="Find a project…">
<label class="sr-only" for="statusFilter">Filter by project status</label>
<select id="statusFilter" class="btn" aria-label="Filter by project status">
<option value="all">ALL STATUS</option>
<option value="active">ACTIVE</option>
<option value="incubating">INCUBATING</option>
<option value="dormant">DORMANT</option>
</select>
</div>
<div id="stats" class="muted"></div>
<section id="constellation" class="jam" style="margin-top:18px">
<div class="muted">CONSTELLATION / ENCYCLOPEDIA</div>
<h2 style="margin:8px 0">The Labyrinth</h2>
<p class="muted">Every node is an entry. Shared tags become corridors. Enter a node, then follow the nearest meanings.</p>
<div id="trail" class="tags"></div>
<div id="atlas" style="margin-top:14px;min-height:120px"></div>
<div id="entry" class="card" hidden style="margin-top:12px"></div>
</section>
<div id="results" class="grid" style="margin-top:12px"></div>
</main>
<script>
/*
  BUILD NOTE
  ----------
  The jammer is a doorway, not a framework. It is intentionally self-contained:
  the project list, interaction rules, and artifact-making loop all live here so
  the first useful action never depends on a package manager, build step, or
  second runtime request. The design contract is discover -> synthesize -> build ->
  test -> expand. A good button therefore produces a concrete premise, then a
  small artifact brief that can be saved, copied, made, and carried elsewhere.

  Persistence is deliberately local-first. Saved briefs remain in the browser,
  while EXPORT SAVED creates a portable JSON snapshot and IMPORT SAVED restores
  one. Import is merge-oriented: incoming briefs are prepended, de-duplicated by
  title + timestamp, and capped at 40 so portability does not erase local work.

  Individual briefs can also be downloaded as plain text. This is intentionally
  redundant with JSON export: JSON preserves structured provenance, while a
  text file is the easiest handoff for a person, a notes app, or a future repository.

  Portable jam records carry schemaVersion=1. The import path validates the small
  durable contract before merging: title, brief, ISO timestamp, and non-empty
  source-node IDs. Invalid records are skipped rather than silently persisted.

  Repository links are explicit metadata, not inferred reachability. They are
  rendered as navigation only when a project has a declared public repo URL.

  The registry view adds one low-cost control instead of a dashboard: a native
  status filter. Search remains broad, while the filter makes active canon and
  incubating experiments distinguishable without changing the underlying data.

  2026-09-23 update: Love Potion 11 is a gentle Luke mode. It produces a small,
  portable encounter rather than an escalation engine: slow pace, low pressure,
  mutual affection, continuity of identity, and no required transformation. The
  result is saved with explicit source IDs so the output can travel with its lineage.

  2026-09-21 update: Veyrthalis and the Hyperspace Expedition are visible nodes.
  The expedition remains experimental pending reconciliation against older lore.
*/
const P=[
['BodyLounger Research Archive','archive','active','historical web research',['archive','research']],
['BEEFYTHIQ','system','active','generative grammar of mass, presence, mutation, and growth',['grammar','growth']],
['The Complex','world','active','persistent creative environment',['world','continuity']],
['Growth Canvas','system','incubating','visual transformation workspace',['visual','rules']],
['Liminal Gains','game','incubating','co-op growth game',['game','co-op']],
['BIG BRUTEFORCE','game','incubating','mutation-engine prototype',['game','mutation']],
['The Facility','world','incubating','fictional research environment',['fiction','research']],
['Muscle Myth','myth','active','pantheon and transformation mythology',['myth','canon']],
['Veyrthalis','world','active','foggy dark expanse; Digitorium, Procession, Binding, Temple of Moon; layered mythic spaces',['world','myth','continuity'],'https://github.com/Ardhtor/GEEHUB/tree/main/lore/veyrthalis'],
['Hyperspace Expedition','story-branch','incubating','four-man descent into a valley city joined to an ancient living presence; experimental branch, not canon',['story','hyperspace','experimental'],'https://github.com/Ardhtor/GEEHUB/blob/main/lore/veyrthalis/HYPERSPACE_EXPEDITION_2026-09-21.md'],
['Growth Tools','tool','incubating','image and video experimentation',['tool','vision']],
['Discovery Engine','tool','incubating','discovery and recommendation experiments',['search','discovery']],
['Retro Lab','aesthetic','dormant','Y2K and older-web experiments',['retro','y2k']],
['Religion as Dialogue','research','active','dialogue and religious-studies research',['thesis','research']],
['The Gods','god','incubating','deities, symbols, myths, and artifacts',['gods','canon']],
['Blender Stand / 3D Workspace','3d','incubating','models, scenes, cameras, and visual output',['blender','3d']],
['ModernTexts','research','active','accessible GitHub repository in the current workspace constellation',['repository','texts','research'],'https://github.com/Ardhtor/ModernTexts'],
['LINUX_S','tool','active','accessible GitHub repository in the current workspace constellation',['repository','linux','systems'],'https://github.com/Ardhtor/LINUX_S']
].map(([name,group,status,summary,tags,repo])=>({id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name,group,status,summary,tags,repo}));
const verbs=['collides with','infects','rebuilds','haunts','tests','renders','escapes into'];
const media=['Blender blockout','five-frame storyboard','single-page web toy','character turnaround','tiny game mechanic','poster-sized diagram','one-minute sound loop'];
const constraints=['one dominant shape','three objects only','one strange material','black-and-white','under five minutes','one rule repeated three times'];
const bodyLines=['BODY: proportion, silhouette, posture, surface, presence.','Zoom in until one physical detail changes the whole figure.','Treat anatomy as a design language: structure → gesture → character.','Let lighting and camera become part of the body.'];
const lukeLines=['LUKE: gay, gentle, present, unmistakably himself.','Stay with Luke without asking him to become anything.','Let affection arrive through recognition, familiarity, and small acts of attention.','Give Luke room to remain himself while something tender accumulates.'];
const $=s=>document.querySelector(s), pick=a=>a[Math.floor(Math.random()*a.length)];
let query='', statusFilter='all', trail=[];
const eco={};
function buildEco(){
  P.forEach(p=>eco[p.id]={node:p,links:[]});
  P.forEach(p=>P.forEach(q=>{
    if(p.id===q.id)return;
    const shared=p.tags.filter(t=>q.tags.includes(t));
    if(shared.length)eco[p.id].links.push({id:q.id,weight:shared.length,tags:shared});
  }));
  Object.values(eco).forEach(x=>x.links.sort((a,b)=>b.weight-a.weight||a.id.localeCompare(b.id)));
}
function renderAtlas(){
  const nodes=visible();
  const focus=trail.length?eco[trail[trail.length-1]]:null;
  const ordered=focus?[focus.node,...focus.links.map(l=>eco[l.id].node)].filter((p,i,a)=>a.findIndex(q=>q.id===p.id)===i):nodes.slice(0,12);
  $('#atlas').innerHTML=ordered.map(p=>'<button class="btn" style="margin:4px" data-atlas="'+esc(p.id)+'">'+esc(p.name)+'</button>').join('');
  $('#atlas').querySelectorAll('[data-atlas]').forEach(b=>b.onclick=()=>openEntry(b.dataset.atlas));
}
function openEntry(id,push=true){
  const x=eco[id]; if(!x)return;
  if(push)trail=[...trail.filter(v=>v!==id),id].slice(-6);
  const p=x.node;
  const links=x.links.slice(0,8).map(l=>{
    const n=eco[l.id].node;
    return '<button class="btn" data-node="'+esc(n.id)+'">'+esc(n.name)+' <span class="muted">· '+esc(l.tags.join(', '))+'</span></button>';
  }).join('');
  $('#entry').hidden=false;
  $('#entry').innerHTML='<div class="muted">'+esc(p.status)+' · '+esc(p.group)+'</div><h2 style="margin:8px 0">'+esc(p.name)+'</h2><p>'+esc(p.summary)+'</p><div class="tags">'+p.tags.map(t=>'#'+esc(t)).join(' ')+'</div><p class="muted">Corridors: '+x.links.length+' · nearest shared meanings first.</p><div class="actions">'+(links||'<span class="muted">No indexed corridors yet.</span>')+'</div>'+(p.repo?'<a class="repo-link" href="'+esc(p.repo)+'" target="_blank" rel="noopener">OPEN REPOSITORY ↗</a>':'');
  $('#entry').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>openEntry(b.dataset.node));
  $('#trail').textContent=trail.map(id=>eco[id].node.name).join('  →  ');
  renderAtlas();
  $('#entry').scrollIntoView({behavior:'smooth',block:'nearest'});
}
buildEco();
function esc(s){return String(s).replace(/[&<>\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]));}
function visible(){const q=query.toLowerCase().trim();return P.filter(p=>(statusFilter==='all'||p.status===statusFilter)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));}
function render(){const rows=visible();const scope=statusFilter==='all'?'all statuses':statusFilter;$('#stats').textContent=`${rows.length} shown · ${P.length} total · ${scope}`;$('#results').innerHTML=rows.map(p=>`<article class="card"><div class="muted">${esc(p.status)} · ${esc(p.group)}</div><h3>${esc(p.name)}</h3><p>${esc(p.summary)}</p><div class="tags">${p.tags.map(t=>'#'+esc(t)).join(' ')}</div>${p.repo?`<a class="repo-link" href="${esc(p.repo)}" target="_blank" rel="noopener">OPEN REPOSITORY ↗</a>`:''}</article>`).join('')||'<div class="card">Nothing found.</div>';}
function focusProject(p){query=p.name;$('#search').value=p.name;render();openEntry(p.id);$('#results').scrollIntoView({behavior:'smooth',block:'start'});}
function setActions(items){$('#actions').innerHTML=items.map(i=>`<button class="btn" id="${i.id}">${i.label}</button>`).join('');items.forEach(i=>document.getElementById(i.id).onclick=i.fn);}
function savedJams(){try{return JSON.parse(localStorage.getItem('geehub-jams')||'[]');}catch{return[];}}
function isPortableJam(x){return !!x&&typeof x==='object'&&x.schemaVersion===1&&typeof x.title==='string'&&x.title.trim()&&typeof x.brief==='string'&&x.brief.trim()&&typeof x.createdAt==='string'&&!Number.isNaN(Date.parse(x.createdAt))&&Array.isArray(x.from)&&x.from.length>0&&x.from.every(id=>typeof id==='string'&&id.trim());}
function jam(){const a=pick(P.filter(p=>p.group!=='archive'));const pool=P.filter(p=>p.id!==a.id&&p.group!==a.group);const b=pick(pool.length?pool:[a]);const v=pick(verbs);$('#artifact').hidden=true;$('#text').textContent=`${a.name} ${v} ${b.name}. Make one tiny thing where both must obey the same rule.`;$('#meta').textContent=`${a.group} × ${b.group} · Keep it small.`;setActions([{id:'open',label:'OPEN',fn:()=>focusProject(a)},{id:'make',label:'MAKE IT',fn:()=>artifact(a,b,v)},{id:'again',label:'AGAIN',fn:jam}]);}
function bodyMode(){ $('#artifact').hidden=true; $('#text').textContent=pick(bodyLines); $('#meta').textContent='FOCUS: BODY · form, scale, presence, consequence.'; setActions([{id:'study',label:'MAKE A BODY STUDY',fn:()=>artifact({id:'body',name:'Body Focus',group:'3d'},{id:'blender',name:'Blender Stand',group:'3d'},'studies')},{id:'again',label:'AGAIN',fn:bodyMode}]); }
function lukeMode(){const line=pick(lukeLines);const title='Luke — Love Potion 11';const brief=''+line+' Create a gentle encounter with Luke: slow pace, low pressure, mutual affection, and no required transformation. Let one small moment of recognition carry the scene. Preserve Luke\'s identity and agency; allow change only if it arises naturally from the encounter.';const saved=savedJams().filter(isPortableJam);saved.unshift({schemaVersion:1,title,brief,createdAt:new Date().toISOString(),from:['luke','love-potion-11']});localStorage.setItem('geehub-jams',JSON.stringify(saved.slice(0,40)));$('#text').textContent=brief;$('#meta').textContent='LOVE POTION 11 · LUKE · gentle / slow / mutual / continuous.';$('#artifact').hidden=false;$('#artifact').innerHTML='<b>'+esc(title)+'</b><p>'+esc(brief)+'</p><div class="actions"><button id="copy" class="btn">COPY</button><button id="download" class="btn">DOWNLOAD BRIEF</button><button id="again" class="btn">STAY WITH LUKE</button></div>';$('#copy').onclick=()=>navigator.clipboard?.writeText(brief).then(()=>$('#meta').textContent='Copied.').catch(()=>{});$('#download').onclick=()=>{const blob=new Blob([title+'\n\n'+brief+'\n\nSchema version: 1\nSource nodes: luke, love-potion-11\nCreated: '+new Date().toISOString()+'\n'],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='luke-love-potion-11.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),0);};$('#again').onclick=lukeMode;$('#artifact').scrollIntoView({behavior:'smooth',block:'nearest'});}
function artifact(a,b,v){const m=pick(media),c=pick(constraints);const title=`${a.name} / ${b.name} — Tiny Study`;const brief=`${a.name} ${v} ${b.name}. Build a ${m} where the shared constraint is: ${c}. Start with the simplest possible version, then make exactly one element stranger.`;const saved=savedJams();saved.unshift({schemaVersion:1,title,brief,createdAt:new Date().toISOString(),from:[a.id,b.id]});localStorage.setItem('geehub-jams',JSON.stringify(saved.filter(isPortableJam).slice(0,40)));$('#artifact').hidden=false;$('#artifact').innerHTML=`<b>${esc(title)}</b><p>${esc(brief)}</p><div class="actions"><button id="copy" class="btn">COPY</button><button id="download" class="btn">DOWNLOAD BRIEF</button><button id="again" class="btn">MAKE ANOTHER</button></div>`;$('#copy').onclick=()=>navigator.clipboard?.writeText(brief).then(()=>$('#meta').textContent='Copied. Now make the tiny version.').catch(()=>$('#meta').textContent='Saved here; the brief is visible above.');$('#download').onclick=()=>{const blob=new Blob([`${title}\n\n${brief}\n\nSchema version: 1\nSource nodes: ${a.id}, ${b.id}\nCreated: ${new Date().toISOString()}\n`],{type:'text/plain'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='geehub-brief.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),0);$('#meta').textContent='Downloaded a plain-text brief with provenance.';};$('#again').onclick=jam;$('#artifact').scrollIntoView({behavior:'smooth',block:'nearest'});}
function exportSaved(){const data=savedJams().filter(isPortableJam);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='geehub-jams.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),0);$('#meta').textContent=data.length?`Exported ${data.length} saved jam${data.length===1?'':'s'}.`:'No portable saved jams to export.';}
function importSaved(file){const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!Array.isArray(incoming))throw new Error('Expected an array');const current=savedJams().filter(isPortableJam);const seen=new Set(current.map(x=>`${x.title}\u0000${x.createdAt}`));let rejected=0;const accepted=incoming.filter(isPortableJam).filter(x=>{const k=`${x.title}\u0000${x.createdAt}`;if(seen.has(k))return false;seen.add(k);return true;});rejected=incoming.length-accepted.length-(incoming.filter(x=>isPortableJam(x)).length-accepted.length);const merged=[...accepted,...current].slice(0,40);localStorage.setItem('geehub-jams',JSON.stringify(merged));$('#meta').textContent=`Imported ${accepted.length} new jam${accepted.length===1?'':'s'}; ${merged.length} saved total${rejected?` · skipped ${rejected} invalid`:''}.`;}catch{ $('#meta').textContent='Import failed: choose a geehub-jams.json export.'; }};reader.readAsText(file);}
$('#surprise').onclick=jam;$('#body').onclick=bodyMode;$('#luke').onclick=lukeMode;$('#saved').onclick=()=>{const s=savedJams().filter(isPortableJam);$('#text').textContent=s.length?s[0].brief:'No saved jams yet.';$('#meta').textContent=`${s.length} portable saved jam${s.length===1?'':'s'} in this browser.`;setActions([{id:'again',label:'MAKE ANOTHER',fn:jam}]);};$('#export').onclick=exportSaved;$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importSaved(e.target.files[0]);e.target.value='';};$('#search').oninput=e=>{query=e.target.value;render();renderAtlas();};$('#statusFilter').onchange=e=>{statusFilter=e.target.value;render();renderAtlas();};
render();renderAtlas();jam();
</script>
</body>
</html>
