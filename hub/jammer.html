<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEEHUB — Narrative Jammer</title><style>body{margin:0;background:#0d0f12;color:#eef1f5;font:16px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:48px 22px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#737d8a}.jam{margin:28px 0;padding:30px;border:1px solid #2b323b;border-radius:16px;background:#151a20;box-shadow:0 20px 60px #0006}.jam h1{font-size:44px;line-height:1;margin:0 0 14px}.premise{font-size:25px;line-height:1.3;min-height:110px;margin:30px 0;color:#f6f7f9}.action{color:#aab2be}.ingredients{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.pill{padding:6px 10px;border:1px solid #303843;border-radius:999px;color:#bfc6d0;background:#11151a}button{border:0;border-radius:10px;padding:14px 18px;font:inherit;cursor:pointer;background:#e9edf2;color:#11151a;margin-right:8px}button.secondary{background:#20262e;color:#d9dee5}.back{color:#bfc6d0;text-decoration:none}.small{color:#7e8794;font-size:13px}</style></head><body><main class="wrap"><div class="eyebrow">GEEHUB / NARRATIVE JAMMER</div><div class="jam"><h1>JAM SOMETHING TOGETHER</h1><p class="small">Pick a collision. Get a premise. Make something from it.</p><div id="premise" class="premise">Press the button. The constellation will choose the ingredients.</div><div id="ingredients" class="ingredients"></div><div><button id="jam">JAM IT</button><button id="again" class="secondary">AGAIN</button></div></div><a class="back" href="./">← Back to the Project Atlas</a></main><script>const projects=[['BEEFYTHIQ','system','growth, mutation, escalation'],['The Complex','world','continuity, canon, cross-pollination'],['Growth Canvas','system','visual rules, latency, anomalies'],['Liminal Gains','game','co-op, growth, feedback'],['BIG BRUTEFORCE','game','mutation, runaway progression'],['The Facility','world','research, sealed ecosystem, CRT'],['Muscle Myth','myth','pantheon, mass, charisma'],['Growth Tools','tool','vision, video, transformation'],['Discovery Engine','tool','search, recommendation, feeds'],['Retro Lab','aesthetic','Y2K, Heisei-tech, old web'],['Religion as Dialogue','research','dialogue, interpretation, communication'],['The Gods','god','symbols, artifacts, canon'],['BodyLounger Research Archive','archive','provenance, labels, lineage'],['Blender Stand / 3D Workspace','3d','modeling, scenes, renders']];const verbs=['infects','becomes','tests','archives','builds','renders','argues with','escapes into','is interrupted by','gets repurposed by'];const formats=['a tiny prototype','a scene','a fake interface','a research question','a ritual object','a game mechanic','a visual study','a short story','an artifact specification'];const constraints=['in one evening','using only five elements','as if it were from 1999','without explaining itself','with one obvious flaw','starting from an ordinary object','with the ending decided first'];function pick(a){return a[Math.floor(Math.random()*a.length)]}function jam(){let a=pick(projects),b=pick(projects.filter(x=>x[0]!==a[0]&&x[1]!==a[1]));let premise=`${a[0]} ${pick(verbs)} ${b[0]}. Make ${pick(formats)} ${pick(constraints)}. The result should leave one useful clue for the next project.`;document.querySelector('#premise').textContent=premise;document.querySelector('#ingredients').innerHTML=[a,b].map(x=>`<span class="pill">${x[0]} · ${x[1]}</span>`).join('')}document.querySelector('#jam').onclick=jam;document.querySelector('#again').onclick=jam;jam();</script></body></html>
