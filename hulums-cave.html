<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cave</title>
<style>
:root{--ice:#8beaff;--fog:0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060a;color:#d7f5fb}body{font-family:Georgia,'Times New Roman',serif}
.world{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#17394a 0,#0b1a24 28%,#050b11 62%,#010306 100%);isolation:isolate}
.world:before{content:"";position:absolute;inset:-10%;background:radial-gradient(ellipse at 50% 62%,#62cde51b 0,transparent 42%),linear-gradient(90deg,#02060ad9,transparent 25%,transparent 75%,#02060ad9);animation:breath 13s ease-in-out infinite alternate}
.vault{position:absolute;inset:-5% 0 0;perspective:900px;transform-style:preserve-3d}
.rib{position:absolute;top:-8%;bottom:9%;width:42%;border-top:1px solid #3d728055;border-bottom:1px solid #3d728022;opacity:.72}
.rib.left{left:-13%;transform:skewY(17deg);border-right:2px solid #4c829033;background:repeating-linear-gradient(90deg,transparent 0 12%,#24465526 12.2% 12.6%,transparent 13% 25%)}
.rib.right{right:-13%;transform:skewY(-17deg);border-left:2px solid #4c829033;background:repeating-linear-gradient(90deg,transparent 0 12%,#24465526 12.2% 12.6%,transparent 13% 25%)}
.path{position:absolute;left:0;right:0;bottom:-14%;height:56%;background:linear-gradient(180deg,#07151e00,#102a36a8 62%,#02070b);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);border-top:1px solid #2c718355}
.threshold{position:absolute;left:50%;top:28%;width:clamp(110px,19vw,300px);height:48%;transform:translateX(-50%);border:1px solid #5a9eb4aa;background:linear-gradient(90deg,#02080c,#102b38 48%,#02080c);box-shadow:0 0 2px #8cecff,inset 0 0 38px #51d8f32b;animation:threshold 12s ease-in-out infinite alternate}
.threshold:before{content:"";position:absolute;inset:4% 7%;background:linear-gradient(180deg,#72e8ff66,#2d92b433 30%,#02070b 100%);box-shadow:0 0 55px #3bbde62b;opacity:.6;animation:light 9s ease-in-out infinite alternate}
.threshold:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#9aeaff55;box-shadow:0 0 20px #5bd8f5}
reflection{display:none}.water{position:absolute;left:16%;right:16%;bottom:2%;height:20%;background:radial-gradient(ellipse,#61d6f51b,transparent 70%);filter:blur(7px);animation:water 6s ease-in-out infinite alternate}
.mist{position:absolute;left:-30%;right:-30%;height:35%;bottom:3%;background:linear-gradient(90deg,transparent,#9beeff0b,#6bdae921,#a8f4ff0a,transparent);filter:blur(22px);animation:drift 19s linear infinite alternate}
.mist.two{bottom:22%;opacity:.5;animation-duration:27s;animation-direction:alternate-reverse}
.speck{position:absolute;width:2px;height:2px;background:#9cecff88;box-shadow:0 0 7px #67dff8;animation:float 11s linear infinite}
.grain{position:absolute;inset:0;opacity:.13;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");mix-blend-mode:screen}
.wordmark{position:absolute;left:clamp(22px,5vw,76px);top:clamp(22px,5vh,58px);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#8dc9d9aa;z-index:5}.poem{position:absolute;left:clamp(22px,5vw,76px);bottom:clamp(38px,8vh,90px);z-index:5;max-width:min(460px,70vw);pointer-events:none}.poem h1{font-size:clamp(28px,4.4vw,58px);font-weight:400;line-height:1.03;letter-spacing:-.035em;margin:0 0 13px;text-shadow:0 0 35px #4ac6ed32}.poem p{font:12px/1.8 ui-monospace,monospace;letter-spacing:.025em;color:#9abdc9;max-width:350px;margin:0;opacity:.82}.trace{position:absolute;right:clamp(22px,5vw,76px);bottom:clamp(40px,8vh,90px);font:10px ui-monospace,monospace;color:#6ca1b2;letter-spacing:.18em;text-align:right;z-index:5}.trace span{display:block;margin-top:9px;color:#b4e8f2aa}
.enter{position:absolute;right:clamp(22px,5vw,76px);top:clamp(20px,4vh,44px);z-index:12;background:transparent;border:0;color:#8ab9c8;font:10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:10px;opacity:.7}.enter:hover{opacity:1;color:#d9f8ff}
.controls{position:absolute;z-index:20;right:24px;top:66px;width:min(290px,calc(100vw - 40px));padding:18px;background:#06111bd9;border:1px solid #4b859344;backdrop-filter:blur(18px);opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .3s,transform .3s}.controls.open{opacity:1;pointer-events:auto;transform:translateY(0)}.controls label{display:block;font:9px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#7ba8b8;margin:14px 0 8px}.controls input,.controls select{width:100%;background:#071019;color:#c9edf5;border:0;border-bottom:1px solid #315261;padding:9px 2px;font:12px ui-monospace,monospace;outline:none}.controls input[type=range]{accent-color:#8beaff;padding:0}.actions{display:flex;gap:9px;margin-top:17px}.actions button{flex:1;padding:11px 8px;border:1px solid #3a7284;background:#0b2632;color:#b8eff9;font:10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.actions button:first-child{background:#b5eff8;color:#061119}.note{font:9px/1.6 ui-monospace,monospace;color:#628695;margin-top:15px}
@keyframes breath{from{transform:scale(1) translateY(0);opacity:.65}to{transform:scale(1.06) translateY(-1%);opacity:1}}
@keyframes threshold{from{transform:translateX(-50%) scaleX(.96);filter:brightness(.7)}to{transform:translateX(-50%) scaleX(1.04);filter:brightness(1.25)}}
@keyframes light{from{opacity:.25}to{opacity:.82}}
@keyframes water{from{transform:scaleX(.85);opacity:.35}to{transform:scaleX(1.15);opacity:.9}}
@keyframes drift{from{transform:translateX(-8%) translateY(0)}to{transform:translateX(8%) translateY(-14%)}}
@keyframes float{0%{transform:translate3d(0,15vh,0);opacity:0}20%{opacity:.7}80%{opacity:.35}100%{transform:translate3d(8vw,-70vh,0);opacity:0}}
@media(max-width:600px){.trace{font-size:9px;bottom:22px}.poem{bottom:100px}.poem p{max-width:260px}.controls{right:12px;top:58px}.rib{width:52%}}
</style>
</head>
<body>
<div class="world" id="world">
 <div class="vault"><div class="rib left"></div><div class="rib right"></div><div class="path"></div><div class="threshold" id="threshold"></div><div class="water"></div><div class="mist"></div><div class="mist two"></div></div>
 <div id="specks"></div><div class="grain"></div>
</div>
<div class="wordmark">a place beneath the signal</div>
<div class="poem"><h1 id="title">The room<br>remembers.</h1><p id="subtitle">Something passed through here. The light has not caught up.</p></div>
<div class="trace"><div id="beat">THE APPROACH</div><span id="time">the dark is still moving</span></div>
<button class="enter" id="tune" aria-expanded="false">adjust the scene <span id="mark">＋</span></button>
<div class="controls" id="controls">
 <label for="seed">A thought to leave here</label><input id="seed" value="the room remembers a passing presence">
 <label for="place">Where you have arrived</label><select id="place"><option value="cave">The buried cave</option><option value="redwood">Redwood at night</option><option value="flood">The flooded passage</option><option value="observatory">The abandoned observatory</option></select>
 <label for="event">What changes</label><select id="event"><option value="light">The light arrives late</option><option value="reflection">The reflection moves first</option><option value="depth">There is more space beyond</option><option value="echo">The room repeats a gesture</option></select>
 <label for="intensity">How deeply it lingers <span id="ival">68%</span></label><input id="intensity" type="range" min="20" max="100" value="68">
 <div class="actions"><button id="run">Begin again</button><button id="hold">Stay here</button></div>
 <div class="note">A continuous scene study. This prototype is an environment, not yet a video renderer.</div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)},elapsed=0,last=performance.now(),playing=true,started=false;
var lines={cave:['Something passed through here. The light has not caught up.','THE APPROACH'],redwood:['The trees are older than the path. A blue glow moves between them.','THE TREE LINE'],flood:['The water holds a second ceiling. Something changes beneath it.','THE FLOOD MARK'],observatory:['The instrument is still turning. There is no sky above it.','THE LAST ORBIT']};
var events={light:['The room remembers.','Something passed through here. The light has not caught up.'],reflection:['The water moves first.','Your reflection has begun to arrive before you.'],depth:['There is more room than there should be.','The threshold opens onto a distance the building cannot hold.'],echo:['The gesture remains.','The architecture repeats a movement after its source has gone.']};
function updatePlace(){var p=$('place').value; $('subtitle').textContent=lines[p][0];$('beat').textContent=lines[p][1];$('world').style.filter=p==='redwood'?'hue-rotate(10deg) saturate(.8)':p==='flood'?'hue-rotate(-8deg) brightness(.85)':p==='observatory'?'hue-rotate(24deg) brightness(1.12)':''}
function updateEvent(){var e=$('event').value;$('title').innerHTML=events[e][0].replace(/\.$/,'').replace(' ','<br> ');$('subtitle').textContent=events[e][1];$('threshold').style.transform=e==='depth'?'translateX(-50%) scaleX(1.16)':e==='reflection'?'translateX(-50%) scaleX(.92)':'translateX(-50%)'}
$('tune').onclick=function(){var open=$('controls').classList.toggle('open');this.setAttribute('aria-expanded',open);$('mark').textContent=open?'−':'＋'};
$('seed').onchange=function(){var s=this.value.trim();if(s){$('title').textContent=s.charAt(0).toUpperCase()+s.slice(1);$('subtitle').textContent='The place takes the shape of what you brought into it.'}};
$('place').onchange=updatePlace;$('event').onchange=updateEvent;
$('intensity').oninput=function(){var v=+this.value;$('ival').textContent=v+'%';document.documentElement.style.setProperty('--fog',v/100);$('world').style.setProperty('--linger',v/100);$('world').style.opacity=.72+v/360;$('threshold').style.animationDuration=(15-v*.09)+'s';document.querySelectorAll('.mist').forEach(function(el){el.style.opacity=.25+v/125})};
$('run').onclick=function(){elapsed=0;last=performance.now();playing=true;started=true;$('time').textContent='the dark is still moving';$('world').animate([{opacity:.35},{opacity:1}],{duration:1700,easing:'ease-out'});$('controls').classList.remove('open');$('tune').setAttribute('aria-expanded','false');$('mark').textContent='＋'};
$('hold').onclick=function(){playing=!playing;this.textContent=playing?'Stay here':'Let it move';$('time').textContent=playing?'the dark is still moving':'the afterimage is held'};
var specks=$('specks');for(var i=0;i<48;i++){var s=document.createElement('i');s.className='speck';s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*110)+'%';s.style.animationDelay=(-Math.random()*14)+'s';s.style.animationDuration=(9+Math.random()*15)+'s';s.style.opacity=(.12+Math.random()*.4);specks.appendChild(s)}
function frame(now){var dt=Math.min(80,now-last);last=now;if(playing){elapsed+=dt;var p=(elapsed%19000)/19000;$('time').textContent=p<.22?'the dark is still moving':p<.48?'something draws nearer':p<.67?'the light changes':'the trace remains';if(p<.22)$('beat').textContent='THE APPROACH';else if(p<.48)$('beat').textContent='CLOSER';else if(p<.67)$('beat').textContent='THE DISTURBANCE';else if(p<.84)$('beat').textContent='HELD IN THE DARK';else $('beat').textContent='AFTERIMAGE';$('threshold').style.filter='brightness('+(0.72+Math.sin(now*.0005)*.12+(p>.48&&p<.68?.3:0))+')';$('threshold').style.boxShadow='0 0 '+(24+Math.sin(now*.0004)*13)+'px #48c9ed55, inset 0 0 38px #51d8f32b'}requestAnimationFrame(frame)}updatePlace();requestAnimationFrame(frame);
})();
</script>
</body></html>
