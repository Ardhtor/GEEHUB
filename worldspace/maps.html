<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEEHUB // DETAILED MAPS</title><style>html,body{margin:0;height:100%;background:#07090b;color:#dce2e8;font:12px system-ui,sans-serif}body{padding:24px}button{background:#11161b;color:#c8d0d8;border:1px solid #303740;padding:8px;margin:3px;cursor:pointer}.active{background:#dce2e8;color:#080a0d}pre{white-space:pre-wrap;color:#9faab5}#map{height:65vh;border:1px solid #252b32;background:radial-gradient(circle at 50% 45%,#303b39,#0a0d0f 68%);position:relative;overflow:hidden}.terrain{position:absolute;inset:8%;transform:rotateX(58deg) rotateZ(-8deg);border:1px solid #737b72;background:repeating-linear-gradient(0deg,transparent 0 24px,#737b72 25px 26px),repeating-linear-gradient(90deg,transparent 0 24px,#737b72 25px 26px);box-shadow:0 0 80px #000 inset}.marker{position:absolute;width:9px;height:9px;border-radius:50%;background:#e1e4e6;box-shadow:0 0 12px #fff}.note{color:#7f8a95}</style></head><body><div class="note">GEEHUB / GEO-CYBERSPACE</div><h1>DETAILED MAPS</h1><div id="scale"></div><div id="layers"></div><div id="map"><div class="terrain" id="terrain"></div></div><pre id="detail">Select a scale or place.</pre><script type="module">const d=await fetch('../geo-cyberspace/detailed-maps.json').then(r=>r.json());let scale='KINGDOM';const layers=new Set(d.layers.map(x=>x.id));const S=document.querySelector('#scale'),L=document.querySelector('#layers'),M=document.querySelector('#terrain'),D=document.querySelector('#detail');function draw(){S.innerHTML=d.scales.map(x=>'<button class="'+(x.id===scale?'active':'')+'" data-s="'+x.id+'">'+x.name+'</button>').join('');L.innerHTML=d.layers.map(x=>'<button class="'+(layers.has(x.id)?'active':'')+'" data-l="'+x.id+'">'+x.label+'</button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{scale=b.dataset.s;draw()});document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{layers.has(b.dataset.l)?layers.delete(b.dataset.l):layers.add(b.dataset.l);draw()});document.querySelectorAll('.marker').forEach(x=>x.remove());for(const m of d.landmarks.filter(x=>x.scale===scale||scale==='WORLD')){const e=document.createElement('i');e.className='marker';e.style.left=(50+m.x*2)+'%';e.style.top=(50+m.z*2)+'%';e.title=m.name;e.onclick=()=>D.textContent=m.name+'\\n'+m.lore+'\\ncoord: '+[m.x,m.y,m.z].join(' / ');document.querySelector('#map').append(e)}}draw();</script></body></html>
